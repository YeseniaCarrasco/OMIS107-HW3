<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guess</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 60px auto;
      text-align: center;
      background-color: #f3e8ff;
      color: #3b0764;
    }
    h1 {
      color: #6d28d9;
    }
    input, button {
      font-size: 18px;
      padding: 8px;
      border: 2px solid #8b5cf6;
      border-radius: 6px;
    }
    input {
      background-color: #ffffff;
      color: #3b0764;
    }
    button {
      background-color: #7c3aed;
      color: #ffffff;
      cursor: pointer;
    }
    button:hover {
      background-color: #6d28d9;
    }
    .reveal-button {
      background-color: #2563eb;
      border-color: #1d4ed8;
    }
    .reveal-button:hover {
      background-color: #1d4ed8;
    }
    #message {
      margin-top: 20px;
      font-size: 20px;
      min-height: 30px;
      color: #5b21b6;
    }
  </style>
</head>
<body>
  <h1>Number Guess</h1>
  <p>I'm thinking of a number from 1 to 100.</p>
  <input type="number" id="guess" min="1" max="100">
  <button id="guessButton" onclick="checkGuess()">Guess</button>
  <button class="reveal-button" onclick="revealNumber()">Reveal</button>
  <p id="message"></p>
  <p>Guesses: <span id="count">0</span></p>
  <button onclick="newGame()">New game</button>

  <script>
    let secret = Math.floor(Math.random() * 100) + 1;
    let count = 0;
     
    function proximityHint(guess) {
      const diff = Math.abs(guess - secret);

      if (diff <= 5)  return "Burning hot!";
      if (diff <= 10) return "Hot.";
      if (diff <= 20) return "Warm.";
      if (diff <= 40) return "Cold.";
      return "Freezing!";
    } 
    let gameActive = true;

    function checkGuess() {
      if (!gameActive) {
        return;
      }

      const input = document.getElementById("guess");
      const guess = Number(input.value);
      const message = document.getElementById("message");

      if (!guess || guess < 1 || guess > 100) {
        message.textContent = "Enter a number from 1 to 100.";
        return;
      }

      count++;
      document.getElementById("count").textContent = count;

      if (guess === secret) {
        message.textContent = "You got it in " + count + " guesses!";
      } else if (guess < secret) {
        message.textContent = "Too low. " + proximityHint(guess);
      } else {
        message.textContent = "Too high. " + proximityHint(guess);
      }
    }

    function revealNumber() {
      if (!gameActive) {
        return;
      }

      gameActive = false;
      document.getElementById("guess").disabled = true;
      document.getElementById("guessButton").disabled = true;
      document.getElementById("message").textContent = "The number was " + secret + ". Start a new game.";
    }

    function newGame() {
      secret = Math.floor(Math.random() * 100) + 1;
      count = 0;
      gameActive = true;
      document.getElementById("count").textContent = 0;
      document.getElementById("message").textContent = "";
      document.getElementById("guess").value = "";
      document.getElementById("guess").disabled = false;
      document.getElementById("guessButton").disabled = false;
    }
  </script>
</body>
</html>
